<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineFind</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- NAVBAR -->
    <!-- ============================= -->

    <nav class="navbar">

        <div class="logo">
            🎬 CineFind
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#movies">Movies</a>
            <a href="#">Web Series</a>
            <a href="#">Watchlist</a>
        </div>

    </nav>


    <!-- ============================= -->
    <!-- HERO -->
    <!-- ============================= -->

    <section class="hero">

        <h1>
            Find Something Great to Watch
        </h1>

        <p>
            Discover movies based on your interests.
        </p>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a movie..."
            >

            <button onclick="searchMovies()">
                Search
            </button>

        </div>

    </section>


    <!-- ============================= -->
    <!-- GENRES -->
    <!-- ============================= -->

    <section class="genre-section">

        <h2>
            Browse by Genre
        </h2>

        <div class="genre-buttons">

            <button onclick="filterGenre('All')">
                All
            </button>

            <button onclick="filterGenre('Action')">
                Action
            </button>

            <button onclick="filterGenre('Comedy')">
                Comedy
            </button>

            <button onclick="filterGenre('Thriller')">
                Thriller
            </button>

            <button onclick="filterGenre('Romance')">
                Romance
            </button>

            <button onclick="filterGenre('Sci-Fi')">
                Sci-Fi
            </button>

            <button onclick="filterGenre('Horror')">
                Horror
            </button>

        </div>

    </section>


    <!-- ============================= -->
    <!-- MOVIES -->
    <!-- ============================= -->

    <section
        class="movie-section"
        id="movies"
    >

        <h2>
            Movies
        </h2>

        <div
            id="movieContainer"
            class="movie-container"
        ></div>

    </section>


    <!-- ============================= -->
    <!-- MOVIE DETAILS -->
    <!-- ============================= -->

    <section
        id="movieDetails"
        class="movie-details"
    ></section>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer>

        <p>
            © 2026 CineFind. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
